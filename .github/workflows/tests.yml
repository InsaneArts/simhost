name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The image with Xcode 27, whose SDK simhost builds against.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
